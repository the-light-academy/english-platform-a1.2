<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Adventure — A1.2 for Kali</title>
<meta name="description" content="Interactive English A1.2 learning platform for Kali — built around cars, animals, travel, sweet cats and books, aligned with Cambridge One." />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/games.css" />
</head>
<body>

<!-- ============================== HEADER ============================== -->
<header class="site-header">
<div class="header-inner">
<div class="brand">
<span class="brand-logo" aria-hidden="true">🚗</span>
<span class="brand-name">English Adventure</span>
</div>
<div class="level-pill" aria-label="Current level">A1.2 · Cambridge One</div>
<div class="header-stats">
<span class="stat-chip" id="stat-points">⭐ 0</span>
<span class="stat-chip" id="stat-streak">🔥 0 days</span>
</div>
</div>
</header>

<main>

<!-- ============================== HERO ============================== -->
<section class="hero">
<div class="hero-content">
<h1 class="hero-title">Hi Kali <span aria-hidden="true">👋</span></h1>
<p class="hero-subtitle">Cars. Cute cats. Travel. Books. Learn English your way.</p>
<div class="hero-actions">
<button class="btn btn-primary btn-lg" id="hero-continue" type="button">Continue Learning →</button>
<button class="btn btn-ghost btn-lg" id="hero-choose" type="button">Choose a Mission</button>
</div>
</div>
<div class="hero-art" aria-hidden="true">
<span class="float-emoji e1">🚗</span>
<span class="float-emoji e3">✈️</span>
<span class="float-emoji e4">🏆</span>
<span class="float-emoji e5">📚</span>
<svg class="hero-kitten" viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg">

  <ellipse cx="162" cy="252" rx="34" ry="26" fill="#FBF2E4"/>

  <ellipse cx="162" cy="258" rx="12" ry="8" fill="#FFC2D1"/>
  <polygon points="48,70 86,18 102,80" fill="#D9C2A8"/>
  <polygon points="192,70 154,18 138,80" fill="#D9C2A8"/>
  <polygon points="58,66 82,34 92,74" fill="#FFC2D1"/>
  <polygon points="182,66 158,34 148,74" fill="#FFC2D1"/>
  <ellipse cx="120" cy="140" rx="92" ry="85" fill="#FBF2E4"/>
  <path d="M34 130 Q60 90 95 108 Q75 118 70 150 Q48 150 34 130Z" fill="#D9C2A8"/>
  <path d="M206 130 Q180 90 145 108 Q165 118 170 150 Q192 150 206 130Z" fill="#D9C2A8"/>
  <path d="M95 68 Q120 52 145 68 Q130 78 120 78 Q110 78 95 68Z" fill="#D9C2A8"/>
  <circle cx="86" cy="138" r="24" fill="#FFFFFF"/>
  <circle cx="154" cy="138" r="24" fill="#FFFFFF"/>
  <circle cx="86" cy="141" r="14" fill="#00B894"/>
  <circle cx="154" cy="141" r="14" fill="#00B894"/>
  <ellipse cx="86" cy="141" rx="5" ry="10" fill="#1C1C28"/>
  <ellipse cx="154" cy="141" rx="5" ry="10" fill="#1C1C28"/>
  <circle cx="82" cy="135" r="3.5" fill="#FFFFFF"/>
  <circle cx="150" cy="135" r="3.5" fill="#FFFFFF"/>
  <path d="M70 118 Q86 108 100 118" stroke="#B79C83" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M140 118 Q154 108 170 118" stroke="#B79C83" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M112 162 Q120 170 128 162 L120 172Z" fill="#FF9EB5"/>

    <path d="M180 168 L224 170"/>
    <path d="M178 178 L222 188"/>
  </g>
</svg>
</div>
</section>

<!-- ============================== PROGRESS ============================== -->
<section class="progress-section" aria-labelledby="progress-heading">
<div class="section-inner">
<h2 id="progress-heading" class="section-title">Your Progress</h2>
<div class="progress-card">
<div class="progress-card-top">
<span class="level-badge" id="stat-level">Level 1</span>
<span class="progress-percent" id="level-progress-label">0%</span>
</div>
<div class="progress-track">
<div class="progress-fill" id="level-progress-bar" style="width:0%"></div>
</div>
</div>
</div>
</section>

<!-- ============================== LEARNING MAP ============================== -->
<section class="learning-map-section" id="learning-map-section" aria-labelledby="map-heading">
<div class="section-inner">
<h2 id="map-heading" class="section-title">Learning Map</h2>
<ol class="learning-map" id="learning-map"><!-- rendered by app.js --></ol>
</div>
</section>

<!-- ============================== LESSON CARDS ============================== -->
<section class="lessons-section" aria-labelledby="lessons-heading">
<div class="section-inner">
<h2 id="lessons-heading" class="section-title">Missions</h2>
<div class="lesson-cards-grid" id="lesson-cards"><!-- rendered by app.js --></div>
</div>
</section>

<!-- ============================== DAILY CHALLENGE ============================== -->
<section class="daily-challenge-section" aria-labelledby="daily-heading">
<div class="section-inner">
<div class="daily-challenge-card">
<div class="daily-challenge-text">
<h2 id="daily-heading" class="section-title">🎯 Today's Mission</h2>
<p id="daily-challenge-label">0 / 5 completed</p>
<div class="progress-track progress-track--sm">
<div class="progress-fill" id="daily-challenge-bar" style="width:0%"></div>
</div>
</div>
<button class="btn btn-primary btn-lg" id="daily-challenge-btn" type="button">START</button>
</div>
</div>
</section>

</main>

<!-- ============================== GAME OVERLAY ============================== -->
<div class="game-overlay" id="game-overlay" role="dialog" aria-modal="true" aria-label="Game">
<div id="game-container"><!-- games render themselves here via engine.js --></div>
</div>

<!-- Floating feedback bubble, positioned via CSS, used by GameSession.showFeedback -->
<div id="feedback-popup" class="feedback-popup" aria-live="polite"></div>

<!-- ============================== SCRIPTS ============================== -->
<script src="js/data.js"></script>
<script src="js/progress.js"></script>
<script src="js/engine.js"></script>
<script src="js/games/flashcards.js"></script>
<script src="js/games/toBe.js"></script>
<script src="js/games/pastTense.js"></script>
<script src="js/games/sentenceBuilder.js"></script>
<script src="js/games/presentTense.js"></script>
<script src="js/games/finalMission.js"></script>
<script src="js/app.js"></script>
</body>
</html>
